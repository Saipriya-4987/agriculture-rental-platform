<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Equipment - AgriRent</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Same header as the other pages, so the site feels like one product -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🌾 AgriRent</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="equipment-list.html">Browse Equipment</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="btn-nav">Register</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- OWNER "LIST EQUIPMENT" PAGE (FR-EQP-01, TRD 10.2 route /equipment/new):
         frontend-only demo, M2 - client-side validation only, no backend/
         database yet (that's M6+). Reuses the exact same .auth-section /
         .auth-card / .auth-form / .form-message / .field-error markup and
         CSS already used by Login and Register, and the same State ->
         District -> Village/City cascading <select> approach (name
         attributes + LOCATION_DATA) already implemented on the Home page -
         js/main.js wires it up identically, no page-specific JS needed for
         the cascade itself. -->
    <section class="auth-section">
      <div class="container">
        <div class="auth-card">
          <h1>List your equipment</h1>
          <p class="auth-subtext">Add your equipment so Farmers nearby can find and rent it.</p>

          <!-- Filled in by js/main.js: "please fix" / success message.
               Empty until the form is submitted once. -->
          <p id="listing-message" class="form-message" aria-live="polite"></p>

          <form class="auth-form" id="listing-form" action="#">
            <label for="listing-name">Equipment Name</label>
            <input type="text" id="listing-name" name="name" placeholder="e.g. Mahindra 575 DI">

            <label for="listing-category">Category</label>
            <select id="listing-category" name="category" aria-label="Category">
              <option value="">Select category</option>
              <option value="tractor">Tractor</option>
              <option value="harvester">Harvester</option>
              <option value="tiller">Tiller</option>
              <option value="seeder">Seeder</option>
              <option value="sprayer">Sprayer</option>
              <option value="other">Other</option>
            </select>

            <!-- Same State -> District -> Village/City cascade as the Home
                 page: name="state"/"district"/"village" so js/main.js's
                 existing stateSelect/districtSelect/villageSelect +
                 populateDistrictOptions()/populateVillageOptions() pick
                 these up automatically. District/Village start with just a
                 placeholder until a State (and District) is chosen. -->
            <label for="listing-state">State</label>
            <select id="listing-state" name="state" aria-label="State">
              <option value="">Select your state</option>
              <option value="andhra-pradesh">Andhra Pradesh</option>
              <option value="telangana">Telangana</option>
              <option value="karnataka">Karnataka</option>
              <option value="tamil-nadu">Tamil Nadu</option>
              <option value="maharashtra">Maharashtra</option>
              <option value="punjab">Punjab</option>
              <option value="gujarat">Gujarat</option>
              <option value="madhya-pradesh">Madhya Pradesh</option>
              <option value="uttar-pradesh">Uttar Pradesh</option>
              <option value="rajasthan">Rajasthan</option>
            </select>

            <label for="listing-district">District</label>
            <select id="listing-district" name="district" aria-label="District">
              <option value="">Select district</option>
            </select>

            <label for="listing-village">Village/City</label>
            <select id="listing-village" name="village" aria-label="Village or city">
              <option value="">Select village/city</option>
            </select>

            <label for="listing-price">Price per Day (&#8377;)</label>
            <input type="number" id="listing-price" name="price_per_day" placeholder="e.g. 1200" min="0" step="0.01">

            <label for="listing-date-from">Available From</label>
            <input type="date" id="listing-date-from" name="available_from" aria-label="Available from">

            <label for="listing-date-until">Available Until</label>
            <input type="date" id="listing-date-until" name="available_until" aria-label="Available until">

            <button type="submit" class="btn-auth">List Equipment</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 AgriRent. Built as a learning project.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>

</body>
</html>
