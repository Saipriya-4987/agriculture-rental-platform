<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriRent</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Same header as the other pages, so the site feels like one product -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🌾 AgriRent</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="equipment-list.html">Browse Equipment</a>
        <a href="login.html" class="active">Login</a>
        <a href="register.html" class="btn-nav">Register</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- LOGIN PAGE (FR-AUTH-02): log in with email OR phone + password.
         No JS/backend yet - this form does not actually submit anything. -->
    <section class="auth-section">
      <div class="container">
        <div class="auth-card">
          <h1>Log in to AgriRent</h1>
          <p class="auth-subtext">Welcome back. Enter your details to continue.</p>

          <!-- Filled in by js/main.js: "please fix" / "Login form is
               valid." message. Empty until the form is submitted once. -->
          <p id="login-message" class="form-message" aria-live="polite"></p>

          <form class="auth-form" id="login-form" action="#">
            <label for="login-identifier">Email or Phone Number</label>
            <input type="text" id="login-identifier" name="identifier" placeholder="you@example.com or 9876543210">

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password">

            <a href="#" class="forgot-link">Forgot password?</a>

            <button type="submit" class="btn-auth">Log In</button>
          </form>

          <p class="auth-switch">
            Don't have an account? <a href="register.html">Register here</a>
          </p>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 AgriRent. Built as a learning project.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>

</body>
</html>
